<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LyricRacer</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" aria-label="LyricRacer home">
    <span class="brand-mark">LR</span>
    <span>LyricRacer</span>
  </a>
  <div id="account">
    <button id="google-sign-in" type="button">Sign in with Google</button>
  </div>
</header>

<main class="page-shell">
  <section class="search-card" aria-labelledby="search-heading">
    <h2 id="search-heading">Find a song</h2>
    <div class="search-fields">
      <div class="field">
        <label for="track">Song title</label>
        <input id="track" type="text" name="track" placeholder="Enter a song title" autocomplete="off">
      </div>
      <div class="field">
        <label for="artist">Artist <span>(optional)</span></label>
        <input id="artist" type="text" name="artist" placeholder="Enter an artist" autocomplete="off">
      </div>
      <button id="search" class="primary-button" type="button">Search lyrics</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <section id="lyrics-section" class="practice-layout">
    <div class="practice-column">
      <article class="panel current-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-label">Current lyric</p>
            <p class="panel-hint">Type the highlighted line before the next one appears.</p>
          </div>
          <div class="timer-actions">
            <span id="timer">0:00</span>
          </div>
        </div>

        <p id="current-lyric" aria-live="polite">Waiting for lyrics...</p>

        <label class="typing-label" for="typing-input">Your typing</label>
        <input id="typing-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Start typing when the first lyric appears...">

        <div class="stats" aria-label="Typing statistics">
          <div><span class="stat-label">WPM</span><strong id="wpm">0</strong></div>
          <div><span class="stat-label">Accuracy</span><strong id="accuracy">0%</strong></div>
          <div><span class="stat-label">Score</span><strong id="score">0</strong></div>
        </div>
      </article>
    </div>

    <aside class="panel lyrics-panel" aria-labelledby="all-lyrics-heading">
      <div class="panel-heading">
        <div>
          <p class="panel-label">Song lyrics</p>
          <h2 id="all-lyrics-heading">All lyrics</h2>
        </div>
      </div>
      <div id="lyrics">
        <p class="empty-state">Search for a song to load its timestamped lyrics.</p>
      </div>
    </aside>
  </section>
</main>

<script src="js/app.js"></script>

</body>
</html>
